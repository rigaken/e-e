<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>华园搭子</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #333;
            --text-sub: #666;
            --nav-height: 60px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 手机容器模拟 */
        #app-container {
            width: 100%;
            max-width: 414px; /* iPhone Max width */
            height: 100%;
            background: var(--bg-gradient);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        /* 顶部导航 */
        header {
            padding: 15px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 800;
            font-size: 20px;
            color: var(--primary-color);
        }
        /* 页面内容区域 */
        .page-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px; /* 留出底部导航空间 */
            display: none; /* 默认隐藏 */
            animation: fadeIn 0.3s ease;
        }
        .page-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .banner-text {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        /* 活动卡片 */
        .activity-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 12px;
        }
        .card-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: #ddd;
        }
        .card-info {
            flex: 1;
        }
        .card-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .card-meta {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card-tags {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #e1f0ff;
            color: var(--primary-color);
        }
        .join-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
        }
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: var(--nav-height);
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            z-index: 20;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #999;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--primary-color);
        }
        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        /* 发布页面 */
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }
        .form-textarea {
            height: 100px;
            resize: none;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        /* 匹配页面 */
        .match-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .match-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }
        .match-score {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
            margin: 10px 0;
        }
        .match-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }
        /* 个人主页 */
        .profile-header {
            height: 180px;
            background-image: url('https://tr-osdcp.qunarzz.com/tr-osd-tr-space/img/0eb257f82f99883be2ffe064b6a65049.jpg_r_680x453x95_572962c4.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            position: relative;
            margin-bottom: 60px; /* Space for avatar overlap */
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            object-fit: cover;
        }
        .profile-info {
            text-align: center;
            margin-top: 10px;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .profile-school {
            font-size: 14px;
            color: var(--text-sub);
            background: #eee;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .profile-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 0 10px;
        }
        .profile-tag {
            background: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: #555;
        }
    </style>
</head>
<body>
<div id="app-container">
    <header>
        <div class="logo">华园搭子</div>
        <div style="font-size: 12px; color: #666;">泉州市</div>
    </header>
    <!-- 首页：活动列表 -->
    <div id="page-home" class="page-content active">
        <div class="banner">
            <div class="banner-text">
                <h3>我在华大<br>找搭子</h3>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; color: #555; font-size: 14px;">
            <span style="font-weight: bold; border-bottom: 2px solid var(--primary-color); padding-bottom: 4px;">最新发布</span>
            <span>距离</span>
            <span>时间</span>
        </div>
        <div id="activity-list">
            <!-- 活动卡片将通过JS插入 -->
        </div>
    </div>
    <!-- 匹配页面 -->
    <div id="page-match" class="page-content">
        <h2 style="margin-bottom: 20px; color: #333;">为你推荐的好友</h2>
        <div id="match-list">
            <!-- 匹配卡片 -->
        </div>
    </div>
    <!-- 发布页面 -->
    <div id="page-publish" class="page-content">
        <h2 style="margin-bottom: 20px;">发布新活动</h2>
        <div class="form-group">
            <label class="form-label">活动标题</label>
            <input type="text" class="form-input" id="pub-title" placeholder="例如：周末羽毛球局">
        </div>
        <div class="form-group">
            <label class="form-label">标签</label>
            <select class="form-select" id="pub-tag">
                <option value="运动">运动</option>
                <option value="戏剧">戏剧</option>
                <option value="学习">学习</option>
                <option value="户外">户外</option>
                <option value="电影">电影</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">时间</label>
            <input type="text" class="form-input" id="pub-time" placeholder="例如：今天 20:00">
        </div>
        <div class="form-group">
            <label class="form-label">地点</label>
            <input type="text" class="form-input" id="pub-loc" placeholder="例如：西操场">
        </div>
        <div class="form-group">
            <label class="form-label">人数限制</label>
            <input type="number" class="form-input" id="pub-limit" placeholder="例如：10">
        </div>
        <div class="form-group">
            <label class="form-label">详细描述</label>
            <textarea class="form-textarea" id="pub-desc" placeholder="活动详情..."></textarea>
        </div>
        <button class="submit-btn" onclick="publishActivity()">发布活动</button>
    </div>
    <!-- 我的页面 -->
    <div id="page-profile" class="page-content">
        <div class="profile-header">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=momo&backgroundColor=b6e3f4" class="profile-avatar" alt="Avatar">
        </div>
        <div class="profile-info">
            <div class="profile-name">momo</div>
            <div class="profile-school">华侨大学 | 外国语学院</div>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px;">
                ENFP找华大好朋鱿~🎾🎬
            </p>
            <div class="profile-tags">
                <span class="profile-tag">🎾 网球</span>
                <span class="profile-tag">🏸 羽毛球</span>
                <span class="profile-tag">🥾 徒步</span>
                <span class="profile-tag">🎬 看电影</span>
                <span class="profile-tag">🦑 斯普拉遁</span>
            </div>
        </div>
        
        <div style="margin-top: 30px; background: white; border-radius: 12px; padding: 15px;">
            <h4 style="margin-bottom: 10px;">我的活动</h4>
            <div style="font-size: 13px; color: #999; text-align: center; padding: 20px;">暂无发布记录</div>
        </div>
    </div>
    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <div class="nav-icon">🏠</div>
            <div>首页</div>
        </div>
        <div class="nav-item" onclick="switchTab('match', this)">
            <div class="nav-icon">💞</div>
            <div>匹配</div>
        </div>
        <div class="nav-item" onclick="switchTab('publish', this)">
            <div class="nav-icon">➕</div>
            <div>发布</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </div>
    </nav>
</div>
<script>
    // 模拟数据
    const activities = [
        {
            title: "创高打卡",
            tag: "运动",
            time: "今天 20:00",
            loc: "西操场",
            limit: 10,
            joined: 6,
            img: "https://ts3.tc.mm.bing.net/th/id/OIP-C.xyVBkSmv9sPtArB7FrWdmwHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
        },
        {
            title: "晨读",
            tag: "阅读",
            time: "周六 7:00",
            loc: "秋中湖",
            limit: 6,
            joined: 4,
            img: "https://youimg1.c-ctrip.com/target/10090s000000iaxrfD8BD.jpg"
        },
        {
            title: "周末羽毛球双打",
            tag: "运动",
            time: "周日 09:30",
            loc: "华大体育馆",
            limit: 4,
            joined: 2,
            img: "https://tse3-mm.cn.bing.net/th/id/OIP-C.sQk5ekdhVEvd9rRZB3MYCQHaEo?w=276&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
        },
        {
            title: "一起看泉州梨园戏",
            tag: "戏剧",
            time: "周日 19:00",
            loc: "西街",
            limit: 2,
            joined: 1,
            img: "https://bkimg.cdn.bcebos.com/smart/58ee3d6d55fbb2fb431694936b1337a4462308f776a2-bkimg-process,v_1,rw_378,rh_252,maxl_756?x-bce-process=image/format,f_auto"
        }
    ];
    // 模拟匹配数据
    const matches = [
        {
            name: "Alex",
            school: "INFP | 计算机系",
            score: 98,
            tags: ["🎾 网球", "🏸 羽毛球", "🎮 游戏"],
            img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Alex&backgroundColor=c0aede"
        },
        {
            name: "Sarah",
            school: "ISTJ | 艺术学院",
            score: 85,
            tags: ["🎬 看电影", "📷 摄影", "☕ 咖啡"],
            img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Sarah&backgroundColor=ffd5dc"
        }
    ];
    // 初始化渲染
    function renderActivities() {
        const container = document.getElementById('activity-list');
        container.innerHTML = '';
        activities.forEach(act => {
            const html = `
                <div class="activity-card">
                    <img src="${act.img}" class="card-img" alt="cover">
                    <div class="card-info">
                        <div class="card-title">${act.title}</div>
                        <div class="card-meta">🕒 ${act.time}</div>
                        <div class="card-meta">📍 ${act.loc}</div>
                        <div class="card-tags">
                            <span class="tag">${act.tag}</span>
                            <span class="tag">${act.joined}/${act.limit}人</span>
                        </div>
                        <button class="join-btn" onclick="joinActivity(this)">参加</button>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }
    function renderMatches() {
        const container = document.getElementById('match-list');
        container.innerHTML = '';
        matches.forEach(match => {
            const html = `
                <div class="match-card">
                    <img src="${match.img}" class="match-avatar" alt="avatar">
                    <h3>${match.name}</h3>
                    <div style="font-size: 12px; color: #666;">${match.school}</div>
                    <div class="match-score">匹配度 ${match.score}%</div>
                    <div class="match-tags">
                        ${match.tags.map(t => `<span class="tag" style="background:#ffecec; color:#ff6b6b">${t}</span>`).join('')}
                    </div>
                    <button class="join-btn" style="margin-top: 15px; width: 100%;">打招呼</button>
                </div>
            `;
            container.innerHTML += html;
        });
    }
    // 交互逻辑
    function switchTab(pageId, navElement) {
        // 隐藏所有页面
        document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
        // 显示目标页面
        document.getElementById('page-' + pageId).classList.add('active');
        
        // 更新导航状态
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        navElement.classList.add('active');
    }
    function joinActivity(btn) {
        btn.innerText = "已报名";
        btn.style.background = "#ccc";
        btn.disabled = true;
        alert("报名成功！期待你的参与。");
    }
    function publishActivity() {
        const title = document.getElementById('pub-title').value;
        const tag = document.getElementById('pub-tag').value;
        const time = document.getElementById('pub-time').value;
        const loc = document.getElementById('pub-loc').value;
        
        if(!title || !time || !loc) {
            alert("请填写完整信息");
            return;
        }
        // 模拟添加到列表
        activities.unshift({
            title: title,
            tag: tag,
            time: time,
            loc: loc,
            limit: document.getElementById('pub-limit').value || 10,
            joined: 1, // 发布者自己
            img: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" // 默认图
        });
        renderActivities();
        alert("活动发布成功！");
        
        // 清空表单
        document.getElementById('pub-title').value = '';
        document.getElementById('pub-time').value = '';
        document.getElementById('pub-loc').value = '';
        
        // 跳转回首页
        document.querySelector('.nav-item:first-child').click();
    }
    // 启动
    renderActivities();
    renderMatches();
</script>
</body>
</html>
